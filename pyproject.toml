[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "worldgen"
version = "0.1.0"
description = "Procedural Earth-like worlds: plate tectonics, climate, biomes, lakes and rivers, with an interactive viewer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.scripts]
worldgen = "worldgen.viewer:main"

[tool.setuptools]
packages = ["worldgen"]
