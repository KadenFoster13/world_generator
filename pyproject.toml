[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "worldgen"
version = "1.1.1"
description = "Procedural Earth-like worlds: plate tectonics, climate, biomes, lakes and rivers, with an interactive viewer."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
fast = ["numba>=0.60"]   # compiles the river routing: much faster, especially at 1600/2400 px

[project.scripts]
worldgen = "worldgen.viewer:main"

[tool.setuptools]
packages = ["worldgen"]
